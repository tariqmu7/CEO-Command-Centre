<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Business Development Dashboard</title>
<style>
  :root {
    --bg: #eef2f7; --card: #ffffff; --text: #1d2b3a; --muted: #5d6b7c; --line: #d6dde7;
    --accent: #1f5fa8; --accent-ink: #ffffff; --stage: #dfe5ee; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1722; --card: #17212e; --text: #e6edf5; --muted: #9aa8b8; --line: #2a3747;
      --accent: #5b9ae0; --accent-ink: #0f1722; --stage: #1a2533; --error: #f2877f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; }
  [hidden] { display: none !important; }
  @media print { html, body { display: none !important; } }

  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--card);
    border-bottom: 1px solid var(--line); min-height: 48px; flex-wrap: wrap; }
  .bar h1 { font-size: 16px; font-weight: 800; margin: 0; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted);
    border: 1px solid var(--line); white-space: nowrap; }
  .spacer { flex: 1; }
  .who { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
  .btn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  body:not(.signed-in) .when-in { display: none; }

  main { flex: 1; min-height: 0; display: flex; }
  .center { margin: auto; padding: 16px; width: 100%; max-width: 420px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  .card h2 { margin: 0 0 6px; font-size: 18px; }
  .card p { margin: 0 0 16px; color: var(--muted); }
  form { display: grid; gap: 10px; margin-top: 14px; }
  input { font: inherit; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); width: 100%; }
  .or { text-align: center; color: var(--muted); font-size: 12px; margin: 14px 0 0; }
  .full { width: 100%; padding: 10px 12px; }
  .error { color: var(--error); font-size: 13px; min-height: 1.5em; margin: 10px 0 0; }

  .loading { flex: 1; background: linear-gradient(90deg, var(--stage), var(--bg), var(--stage)); background-size: 300% 100%;
    animation: shimmer 1.4s infinite linear; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) { .loading { animation: none; } }

  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #dfe5ee; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  @media (max-width: 600px) { .who { display: none; } .bar { padding: 8px 12px; } }
</style>
<script type="module" src="./app.js"></script>
</head>
<body oncontextmenu="return false">
  <header class="bar">
    <h1>Business Development Dashboard</h1>
    <span class="badge" id="built" hidden></span>
    <span class="spacer"></span>
    <span class="who when-in" id="who"></span>
    <button type="button" class="btn when-in" id="reload">Reload</button>
    <a class="btn" data-etaske href="https://tariqmu7.github.io/ETaske/">Back to eTaske</a>
    <button type="button" class="btn when-in" id="signout">Sign out</button>
  </header>

  <main>
    <div class="center" data-view="login" hidden>
      <div class="card">
        <h2>Sign in</h2>
        <p>Use your eTaske account. This page is for managers only.</p>
        <button type="button" class="btn primary full" id="google">Sign in with Google</button>
        <div class="or">or with e-mail</div>
        <form id="email-form">
          <input id="email" type="email" autocomplete="username" placeholder="E-mail" required>
          <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
          <button type="submit" class="btn full">Sign in</button>
        </form>
        <div class="error" id="login-error" role="alert"></div>
      </div>
    </div>

    <div class="loading" data-view="loading" aria-label="Opening the dashboard…"></div>

    <div class="center" data-view="message" hidden>
      <div class="card"><p id="msg-text" style="margin:0"></p></div>
    </div>

    <!-- allow-scripts only: an opaque origin (no sign-in session, no storage), and
         no allow-modals / allow-downloads / allow-popups = no print, no saving, no new tabs. -->
    <div class="stage" id="stage" data-view="stage" hidden>
      <iframe id="frame" title="Business Development Dashboard" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
    </div>
  </main>
</body>
</html>
